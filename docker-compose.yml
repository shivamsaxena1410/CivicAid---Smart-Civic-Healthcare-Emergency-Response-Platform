services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: civicconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: civic_user
      POSTGRES_PASSWORD: civic_password_2026
      POSTGRES_DB: civicconnect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic_user -d civicconnect_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civicconnect_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
